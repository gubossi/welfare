<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사회복지시설 종사자 급여 계산기 | Welmoa</title>
  <meta
    name="description"
    content="사회복지시설 종사자 급여 구조를 이해하고 기본급, 수당, 공제, 실수령액을 확인할 수 있는 Welmoa 급여 계산기입니다."
  />
  <link rel="stylesheet" href="/assets/site.css" />

  <style>
    :root {
      --salary-accent: #3559a8;
      --salary-accent-dark: #2c4a8a;
      --salary-bg-soft: #f5f8ff;
      --salary-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    .salary-page {
      padding-bottom: 32px;
    }

    .salary-page .hero-card {
      padding: 32px;
    }

    .salary-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.85fr);
      gap: 20px;
      align-items: start;
    }

    .salary-subgrid {
      display: grid;
      gap: 20px;
    }

    .salary-card-title {
      margin: 0 0 14px;
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text);
    }

    .salary-card-desc {
      margin: -4px 0 16px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.96rem;
    }

    .salary-panel {
      padding: 0;
      overflow: hidden;
    }

    .salary-panel-header {
      padding: 22px 24px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }

    .salary-panel-body {
      padding: 22px 24px 24px;
    }

    .salary-form-section + .salary-form-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .salary-section-label {
      margin: 0 0 10px;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text);
    }

    .salary-help {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .salary-form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: var(--text);
    }

    .salary-grid-2,
    .salary-grid-3 {
      display: grid;
      gap: 14px;
    }

    .salary-grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .salary-grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .salary-form input,
    .salary-form select,
    .salary-form textarea,
    #btnCalc,
    #btnDownload {
      width: 100%;
      border-radius: 12px;
      font: inherit;
    }

    .salary-form input,
    .salary-form select,
    .salary-form textarea {
      border: 1px solid var(--border);
      padding: 12px 14px;
      line-height: 1.5;
      background: #fff;
      color: var(--text);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      box-sizing: border-box;
    }

    .salary-form input:focus,
    .salary-form select:focus,
    .salary-form textarea:focus {
      outline: none;
      border-color: #bfd1f8;
      box-shadow: 0 0 0 4px rgba(53, 89, 168, 0.12);
    }

    .salary-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .salary-actions > * {
      flex: 1 1 220px;
    }

    .btn-primary,
    #btnCalc {
      background: var(--salary-accent);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 8px 20px rgba(53, 89, 168, 0.18);
    }

    .btn-primary:hover,
    #btnCalc:hover {
      background: var(--salary-accent-dark);
      transform: translateY(-1px);
    }

    .btn-secondary,
    #btnDownload {
      background: #fff;
      color: var(--salary-accent);
      border: 1px solid #d9e6ff;
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-secondary:hover,
    #btnDownload:hover {
      background: #f3f7ff;
    }

    .choice-pills,
    .inline-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill,
    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text);
      box-sizing: border-box;
    }

    .pill input,
    .check-chip input {
      width: auto;
      margin: 0;
      accent-color: var(--salary-accent);
    }

    #allowanceChecks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #allowanceChecks label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      margin: 0;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      font-weight: 600;
      cursor: pointer;
    }

    #allowanceChecks input {
      width: auto;
      margin: 0;
      accent-color: var(--salary-accent);
    }

    .salary-status-wrap {
      margin-top: 14px;
    }

    #status {
      margin-top: 0;
      color: var(--muted);
    }

    #error {
      margin-top: 8px;
    }

    .result-summary {
      display: grid;
      gap: 14px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--salary-bg-soft);
      color: var(--salary-accent);
      font-weight: 800;
      font-size: 0.92rem;
    }

    .result-card-box {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
      padding: 18px;
    }

    .result-card-box + .result-card-box {
      margin-top: 14px;
    }

    .table-wrap {
      margin-top: 10px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    #monthlyTable,
    #yearlyTable,
    #deductionTable,
    #taxTable {
      width: 100%;
      border-collapse: collapse;
      min-width: 280px;
    }

    #monthlyTable th,
    #monthlyTable td,
    #yearlyTable th,
    #yearlyTable td,
    #deductionTable th,
    #deductionTable td,
    #taxTable th,
    #taxTable td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      font-size: 0.96rem;
    }

    #monthlyTable tr:last-child td,
    #yearlyTable tr:last-child td,
    #deductionTable tr:last-child td,
    #taxTable tr:last-child td {
      border-bottom: none;
    }

    #monthlyTable th,
    #yearlyTable th,
    #deductionTable th,
    #taxTable th {
      background: #fafcff;
      color: var(--text);
      font-weight: 800;
    }

    .salary-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .quick-links {
      display: grid;
      gap: 12px;
    }

    .quick-link-card {
      display: block;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .quick-link-card:hover {
      background: #fbfdff;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    .quick-link-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: var(--text);
    }

    .quick-link-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .notice-box {
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .notice-box-title {
      margin: 0 0 8px;
      font-weight: 800;
      color: var(--text);
    }

    @media (max-width: 1024px) {
      .salary-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .salary-page .hero-card,
      .salary-panel-header,
      .salary-panel-body {
        padding-left: 18px;
        padding-right: 18px;
      }

      .salary-grid-2,
      .salary-grid-3 {
        grid-template-columns: 1fr;
      }

      .result-top {
        flex-direction: column;
      }

      .salary-actions > * {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Welmoa</a>
      <nav>
        <a href="/">홈</a>
        <a href="https://tools.welmoa.kr/tools/">도구</a>        
        <a href="/blog/">콘텐츠</a>
        <a href="/about/">소개</a>
        <a href="/privacy/">개인정보처리방침</a>
        <a href="/terms/">이용약관</a>
      </nav>
    </div>
  </header>
  
<div class="container">

<!-- HERO -->
<div class="hero-card">
  <h1>사회복지시설 종사자 급여 계산기</h1>
  <p>기본급, 수당, 공제 구조를 이해하고 실수령액을 빠르게 확인할 수 있습니다.</p>
</div>

<!-- MAIN -->
<div class="salary-layout">

<!-- LEFT (INPUT) -->
<div class="card salary-form" id="inputCard">

<div class="section-block">
  <h3>기본 정보</h3>
  <div class="salary-grid">
    <div>
      <label>기준년도</label>
      <select id="year"></select>
<label for="year">기준년도</label>
                  <select id="year"></select>
      
    </div>
    <div>
      <label>시설 유형</label>
      <select id="facilityType"></select>
    </div>
    <div>
      <label>직급</label>
      <select id="grade"></select>
    </div>
    <div>
      <label>호봉</label>
      <select id="step"></select>
    </div>
  </div>
</div>

<div class="section-block">
  <h3>비과세</h3>
  <input id="nonTaxableMonthly" type="number" value="0"/>
</div>

<div class="section-block">
  <h3>가족수당</h3>
  <label><input id="spouse" type="checkbox"/> 배우자</label>
  <div class="salary-grid">
    <input id="children" type="number" value="0"/>
    <input id="otherDependents" type="number" value="0"/>
  </div>
</div>

<div class="section-block">
  <h3>시간외</h3>
  <div class="salary-grid">
    <input id="overtimeHours" type="number" value="0"/>
    <select id="overtimeKind">
      <option value="1.5">1.5배</option>
      <option value="2.0">2.0배</option>
    </select>
  </div>
</div>

<div class="section-block">
  <h3>옵션</h3>
  <div id="allowanceChecks"></div>

  <label><input id="includeDeductions" type="checkbox"/> 4대보험 포함</label>
  <label><input id="includeTax" type="checkbox"/> 세금 포함</label>
</div>

<div class="section-block">
  <button id="btnCalc">계산하기</button>
  <button id="btnDownload">엑셀 다운로드</button>
</div>

</div>

<!-- RIGHT (RESULT) -->
<div>

<div class="card" id="resultCard" style="display:none;">
  <h3>예상 실수령액</h3>
  <div class="result-big" id="kpiBoxes"></div>

  <div class="result-card">
    <h4>월 수당</h4>
    <table id="monthlyTable"></table>
  </div>

  <div class="result-card">
    <h4>연 수당</h4>
    <table id="yearlyTable"></table>
  </div>

  <div id="deductionCard" class="result-card" style="display:none;">
    <h4>공제</h4>
    <table id="deductionTable"></table>
  </div>

  <div id="taxCard" class="result-card" style="display:none;">
    <h4>세금</h4>
    <table id="taxTable"></table>
  </div>

</div>

<div class="card" id="resultEmpty">
  입력 후 계산을 눌러주세요
</div>

</div>

</div>
</div>


    <footer class="site-footer">
    <div class="container footer-inner">
      <div>© Welmoa. 사회복지 실무자를 위한 도구와 정보 플랫폼</div>
      <div class="footer-links">
        <a href="/about/">소개</a>
        <a href="/privacy/">개인정보처리방침</a>
        <a href="/terms/">이용약관</a>
        <a href="/blog/">콘텐츠 모음</a>
      </div>
    </div>
    <div class="container" style="padding-bottom:24px; color:#777; font-size:13px;">
      본 사이트는 사회복지 실무 정보 제공을 목적으로 운영됩니다.
    </div>
  </footer>

  
  <script src="./app.js"></script>
  <script>
    // 결과가 표시되면 빈 안내 문구를 숨기기 위한 보조 처리
    (function () {
      const resultCard = document.getElementById("resultCard");
      const resultEmpty = document.getElementById("resultEmpty");
      if (!resultCard || !resultEmpty) return;

      const observer = new MutationObserver(() => {
        const isVisible = getComputedStyle(resultCard).display !== "none";
        resultEmpty.style.display = isVisible ? "none" : "block";
      });

      observer.observe(resultCard, { attributes: true, attributeFilter: ["style", "class"] });

      const isVisible = getComputedStyle(resultCard).display !== "none";
      resultEmpty.style.display = isVisible ? "none" : "block";
    })();
  </script>
</body>
</html>
